# Include once from printer.cfg. Remove the old [plr_home] section/include to
# avoid duplicate PLR_HOME command registration. Never use stock
# RESUME_INTERRUPTED or stock RESUME for this recovery path.
[sv08_plr]
bundle_path: /home/sovol/printer_data/config/plr-recovery.json
# Set to SHA256 of the reviewed bundle produced by tools/prepare_recovery.py.
bundle_sha256:
# Set True only after the stock geometry/routing checks in docs/GEOMETRY.md.
stock_geometry_confirmed: False
front_fallback: True

[gcode_macro PLR_HOME]
description: Recovery home from verified bundle; DRY_RUN=1 or CONFIRM=1
gcode:
    _SV08_PLR_HOME {rawparams}

[gcode_macro PLR_RESUME]
description: Home if needed, restore, position, and resume once from exact byte
gcode:
    _SV08_PLR_RESUME {rawparams}
